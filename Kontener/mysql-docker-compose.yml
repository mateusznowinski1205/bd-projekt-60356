version: '29.2.1'

services:
  mysql:
    image: mysql:latest
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Ustaw MYSQL_ROOT_PASSWORD w pliku .env}"
      MYSQL_DATABASE: example_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Ustaw MYSQL_PASSWORD w pliku .env}"
    ports:
      - "3306:3306"
    restart: always